<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>農業管理システム</title>

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#2E7D32">

<link rel="stylesheet" th:href="@{/css/style.css}">

<script defer th:src="@{/js/script.js}"></script>

</head>


<body>


<header class="header">

<h1>
🌱 農業管理システム
</h1>

<p>
Smart Farm Management
</p>

</header>



<main class="container">


<section class="welcome">


<h2>
北総農園 ダッシュボード
</h2>


<p>
本日の農場状況を確認できます。
</p>


</section>



<!-- 状況カード -->

<section class="status-area">


<div class="status-card">

<h3>
🌱 作物
</h3>

<p th:text="${cropCount} + '種類'">
</p>

<span>
管理中
</span>

</div>



<div class="status-card">

<h3>
📅 作業予定
</h3>


<p th:text="${todayCount} + '件'">
<span>
本日
</span>

</div>



<div class="status-card">

<h3>
🍠 収穫予定
</h3>


<p th:if="${nextHarvest != null}"
   th:text="${nextHarvest.harvestDate}">
</p>


<p th:if="${nextHarvest == null}">
予定なし
</p>


<span th:if="${nextHarvest != null}"
      th:text="${nextHarvest.cropName}">
</span>


<span th:if="${nextHarvest == null}">
次回
</span>


</div>


</section>




<!-- 今日の作業 -->


<section class="panel">


<h2>
今日の作業
</h2>

<div class="work-item"
     th:each="work : ${todaySchedules}">


<h3 th:text="${work.schedule}">
</h3>


<p>
場所：
<span th:text="${work.fieldName}">
</span>
</p>


<p>
作物：
<span th:text="${work.cropName}">
</span>
</p>


<p>
担当：
<span th:text="${work.userName}">
</span>
</p>


</div>



<div class="work-item">

<h3>
🥕 人参除草
</h3>


<p>
場所：B圃場
</p>


<p>
状態：🟢完了
</p>


</div>



</section>





<!-- 管理メニュー -->


<section class="card-area">


<a th:href="@{/calendar}" class="card">

<div class="card-title">

<span>
📅 作業カレンダー
</span>

<span>
›
</span>

</div>


<p>
作業予定・担当者を管理
</p>


</a>



<a th:href="@{/crop}" class="card">


<div class="card-title">

<span>
🌱 作物管理
</span>

<span>
›
</span>


</div>


<p>
品種・植付・収穫管理
</p>


</a>



<a th:href="@{/field}" class="card">


<div class="card-title">

<span>
🚜 圃場管理
</span>

<span>
›
</span>

</div>


<p>
畑情報を管理
</p>


</a>



<a th:href="@{/management}" class="card">


<div class="card-title">

<span>
📊 経営管理
</span>

<span>
›
</span>


</div>


<p>
売上・経費管理
</p>


</a>


</section>





<div class="ai-link">


<a href="/ai">

🤖 AI農業アシスタント

</a>


</div>



</main>



<footer class="footer">

Version 1.0

</footer>



</body>

</html>
