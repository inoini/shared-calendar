<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>農業管理システム | 設定</title><link rel="stylesheet" th:href="@{/css/style.css(v='20260908-2')}"><link rel="stylesheet" th:href="@{/css/professional-ui.css(v='20260908-2')}"><link rel="stylesheet" th:href="@{/css/calendar-dashboard.css(v='20260908-2')}"><link rel="stylesheet" th:href="@{/css/operations.css(v='20260908-2')}"><script defer th:src="@{/js/script.js(v='20260908-2')}"></script></head>
<body class="dashboard-body calendar-screen operations-screen"><button id="menuBtn" class="menu-btn" type="button" aria-label="メニューを開閉" aria-controls="mainSidebar" aria-expanded="false">☰</button><div class="app-layout"><aside th:replace="~{fragments/operations-sidebar :: sidebar('settings')}"></aside><main class="main-content"><div class="operations-page">
    <header class="operations-heading"><div><h1>設定</h1><p>システム名、月間収穫目標、通知を設定します。</p></div></header>
    <div class="alert alert-success" th:if="${param.saved}">設定を保存しました。</div>
    <section class="operations-panel" style="max-width:720px"><h2>基本設定</h2><form th:action="@{/settings/save}" th:object="${setting}" method="post"><input type="hidden" th:field="*{id}"><label for="farmName">システム・農園名</label><input id="farmName" type="text" th:field="*{farmName}" maxlength="100" required><label for="monthlyHarvestTargetKg">月間収穫目標（kg）</label><input id="monthlyHarvestTargetKg" type="number" min="1" step="0.1" th:field="*{monthlyHarvestTargetKg}" required><label class="operations-checkbox"><input type="checkbox" name="notificationsEnabled" value="true" th:checked="${setting.notificationsEnabled == null or setting.notificationsEnabled}">通知を有効にする</label><button class="operation-button primary" type="submit">設定を保存</button></form></section>
</div></main></div></body></html>
