<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>農業管理システム | 分析・レポート</title><link rel="stylesheet" th:href="@{/css/style.css(v='20260908-2')}"><link rel="stylesheet" th:href="@{/css/professional-ui.css(v='20260921-2')}"><link rel="stylesheet" th:href="@{/css/calendar-dashboard.css(v='20260908-2')}"><link rel="stylesheet" th:href="@{/css/operations.css(v='20260908-2')}"><script defer th:src="@{/js/script.js(v='20260908-2')}"></script></head>
<body class="dashboard-body calendar-screen operations-screen" th:classappend="|theme-${uiTheme} layout-${layoutMode}|"><button id="menuBtn" class="menu-btn" type="button" aria-label="メニューを開閉" aria-controls="mainSidebar" aria-expanded="false">☰</button><div class="app-layout"><aside th:replace="~{fragments/operations-sidebar :: sidebar('reports')}"></aside><main class="main-content"><div class="operations-page">
    <header class="operations-heading"><div><h1>分析・レポート</h1><p>作業、生産、経営の登録データを自動集計します。</p></div></header>
    <section class="report-card-grid"><article class="report-card"><span>作業完了率</span><strong th:text="${completionRate + '%'}">0%</strong></article><article class="report-card"><span>登録圃場</span><strong th:text="${fieldCount + '件'}">0件</strong></article><article class="report-card"><span>登録作物</span><strong th:text="${cropCount + '件'}">0件</strong></article><article class="report-card"><span>収穫量</span><strong th:text="${#numbers.formatDecimal(harvestedKg, 0, 1) + 'kg'}">0kg</strong></article><article class="report-card"><span>出荷量</span><strong th:text="${#numbers.formatDecimal(shippedKg, 0, 1) + 'kg'}">0kg</strong></article><article class="report-card"><span>売上</span><strong th:text="${#numbers.formatInteger(salesTotal, 1, 'COMMA') + '円'}">0円</strong></article><article class="report-card"><span>経費</span><strong th:text="${#numbers.formatInteger(expenseTotal, 1, 'COMMA') + '円'}">0円</strong></article><article class="report-card"><span>収支</span><strong th:text="${#numbers.formatInteger(profitTotal, 1, 'COMMA') + '円'}">0円</strong></article></section>
    <section class="operations-panel"><h2>作業種類別件数</h2><div class="work-type-row" th:each="entry : ${workTypeCounts}"><span th:text="${entry.key}">管理</span><div class="work-type-bar"><i th:style="${'width:' + (entry.value * 100 / workTypeMax) + '%'}"></i></div><strong th:text="${entry.value}">0</strong></div><p class="operations-empty" th:if="${workTypeCounts.isEmpty()}">集計できる作業がまだありません。</p></section>
</div></main></div></body></html>
