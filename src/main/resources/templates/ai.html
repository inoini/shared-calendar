<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">


<title>AI農業アシスタント</title>


<link rel="stylesheet" th:href="@{/css/style.css}">


</head>


<body>


<header class="header">


<h1>
🤖 AI農業アシスタント
</h1>


<p>
Smart Farm Support
</p>


</header>




<main class="container">



<section class="welcome">


<h2>
農業相談AI
</h2>


<p>
作物の管理方法、病害虫、肥料、栽培について相談できます。
</p>


</section>





<section class="panel">



<h2>
質問入力
</h2>



<form action="/ai" method="post">


<textarea 
name="question"
placeholder="例：さつまいもの葉が黄色くなりました。原因を教えてください。"
th:text="${question}">
</textarea>



<button type="submit">
🌱 AIに相談する
</button>



</form>



</section>






<section class="panel"
         th:if="${answer}">



<h2>
🤖 AI回答
</h2>



<div class="answer">


<p th:text="${answer}">
</p>


</div>



</section>






<div class="back-home">


<a href="/">
← ダッシュボードへ戻る
</a>


</div>




</main>




<footer class="footer">

Version 1.0

</footer>



</body>

</html>
