<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>在庫管理</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="stock-container">

<h1>📦 在庫管理</h1>

<p>肥料・農薬・種・苗などの在庫を管理します。</p>

<hr>

<form th:action="@{/stock/save}" th:object="${stock}" method="post">

<input type="hidden" th:field="*{id}">

<label>資材名</label>
<input type="text" th:field="*{itemName}" required>

<label>カテゴリ</label>

<select th:field="*{category}">
    <option value="肥料">肥料</option>
    <option value="農薬">農薬</option>
    <option value="種">種</option>
    <option value="苗">苗</option>
    <option value="その他">その他</option>
</select>

<label>在庫数量</label>
<input type="number" th:field="*{quantity}">

<label>単位</label>

<select th:field="*{unit}">
    <option value="kg">kg</option>
    <option value="袋">袋</option>
    <option value="本">本</option>
    <option value="箱">箱</option>
    <option value="粒">粒</option>
</select>

<label>最低在庫</label>
<input type="number" th:field="*{minimumStock}">

<label>保管場所</label>
<input type="text" th:field="*{location}">

<label>備考</label>
<textarea th:field="*{memo}"></textarea>

<br>

<button type="submit">💾 保存</button>

</form>

<hr>

<h2>在庫一覧</h2>

<table class="stock-table">

<thead>

<tr>

<th>資材名</th>

<th>カテゴリ</th>

<th>数量</th>

<th>単位</th>

<th>最低在庫</th>

<th>保管場所</th>

<th>編集</th>

<th>削除</th>

</tr>

</thead>

<tbody>

<tr th:each="stock : ${stockList}">

<td th:text="${stock.itemName}"></td>

<td th:text="${stock.category}"></td>

<td th:text="${stock.quantity}"></td>

<td th:text="${stock.unit}"></td>

<td th:text="${stock.minimumStock}"></td>

<td th:text="${stock.location}"></td>

<td>


<a class="stock-edit"
   th:href="@{/stock/edit/{id}(id=${stock.id})}">
    ✏ 編集
</a>
</td>

<td>

<a class="stock-delete"
   th:href="@{/stock/delete/{id}(id=${stock.id})}"
   onclick="return confirm('削除しますか？')">
    🗑 削除
</a>


</td>

</tr>

</tbody>

</table>

<br>

<a href="/">🏠 トップへ戻る</a>

</div>

</body>

</html>
